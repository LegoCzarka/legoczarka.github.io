name: Aktualizuj zestawy z Rebrickable

on:
  workflow_dispatch:
    inputs:
      enforce_cooldown:
        description: "Pomiń aktualizację, jeśli od ostatniej minęło mniej niż 6 godzin"
        type: boolean
        default: false
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC (noc w PL)

permissions:
  contents: write

concurrency:
  group: update-rebrickable
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Fetch from Rebrickable (READ ONLY)
        env:
          REBRICKABLE_KEY: ${{ secrets.REBRICKABLE_KEY }}
          REBRICKABLE_USER_TOKEN: ${{ secrets.REBRICKABLE_USER_TOKEN }}
          ENFORCE_COOLDOWN: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_cooldown || 'false' }}
        run: |
          if [ "$ENFORCE_COOLDOWN" = "true" ]; then
            python scripts/fetch_rebrickable.py --cooldown-hours 6
          else
            python scripts/fetch_rebrickable.py
          fi

      - name: Commit & push sets.json (bez konfliktów)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/sets.json docs/data/sets.js
          if git diff --cached --quiet; then
            echo "Brak zmian do wypchnięcia."
            exit 0
          fi

          git commit -m "Update Rebrickable sets"

          # 3 próby, bo czasem 2 akcje wpadają prawie jednocześnie
          pushed=false
          for i in 1 2 3; do
            echo "Push attempt $i..."
            if git pull --rebase origin main && git push; then
              pushed=true
              break
            fi
            sleep 2
          done

          if [ "$pushed" != "true" ]; then
            echo "Błąd: nie udało się wypchnąć zmian po 3 próbach." >&2
            exit 1
          fi
